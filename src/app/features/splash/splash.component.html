<ion-content [fullscreen]="true" [scrollY]="false">
  <tumbo-fondo-decorativo aria-hidden="true" />
  <section class="splash-page" [class.splash-page--lista]="lista()" aria-labelledby="splash-title">
    <div class="splash-page__brand">
      <div class="splash-page__logo-wrap" [class.splash-page__logo-wrap--empty]="sinImagen()">
        <img
          class="splash-page__logo"
          ngSrc="imagenes/logo-splash.webp"
          width="768"
          height="768"
          priority
          disableOptimizedSrcset
          alt="Tumbito, nuestra vaquita con su bandeja"
          (load)="imagenCargada($event)"
          (error)="imagenFallida()"
        />
      </div>
      <h1 id="splash-title">TUMBITO<span aria-hidden="true">.</span></h1>
      <!--
        Requisito excluyente de la primera fecha: la presentación muestra
        el ícono, el nombre del grupo y los apellidos y nombres de los
        integrantes. El rediseño del 07/09 los había sacado.
      -->
      <p class="splash-page__grupo">Grupo Tumbito</p>
      <ul class="splash-page__equipo" aria-label="Integrantes del grupo">
        <li>Terrile, Mateo</li>
        <li>Bianucci, Ramiro</li>
        <li>Cruz, Ignacio Agustín</li>
        <li>Ferrari, Matías Gabriel</li>
      </ul>
      @if (error()) {
        <div class="splash-page__error">
          <p role="alert">No pudimos abrir la aplicación.</p>
          <ion-button (click)="continuar()">Reintentar</ion-button>
        </div>
      } @else {
        <!-- Secuencia de bienvenida, no un porcentaje ficticio de descarga. -->
        <div class="splash-page__loader" role="progressbar" aria-label="Abriendo Tumbito">
          <div class="splash-page__track" aria-hidden="true">
            <span class="splash-page__fill"></span>
            <span class="splash-page__glint"></span>
          </div>
        </div>
      }
    </div>
  </section>
</ion-content>
