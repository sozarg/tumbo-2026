<ion-content [fullscreen]="true" class="home-page">
  @if (usuario(); as usuarioActual) {
    <tumbo-fondo-decorativo />
    <main class="home-layout">
      <header class="home-header">
        <div class="brand-lockup">
          <img
            class="brand-lockup__lockup"
            ngSrc="imagenes/logo-nombre.png"
            width="2168"
            height="725"
            priority
            alt="Tumbito"
          />
        </div>

        <ion-button
          class="logout-button"
          fill="outline"
          aria-label="Cerrar sesión"
          (click)="cerrarSesion()"
        >
          <ion-icon slot="start" name="log-out-outline" />
          Salir
        </ion-button>
      </header>
      <section class="welcome" aria-labelledby="welcome-title">
        <div>
          <h1 id="welcome-title">Hola, {{ usuarioActual.nombres.split(' ')[0] }}.</h1>
          <p>¿Por dónde querés empezar?</p>
        </div>
      </section>

      <section class="panel-section" aria-labelledby="actions-title">
        <div class="section-heading">
          <div>
            <h2 id="actions-title">¿Qué querés hacer?</h2>
          </div>
        </div>

        <div class="action-grid" role="list" aria-label="Áreas del panel">
          @for (accion of acciones(); track accion.titulo) {
            <ion-card class="action-card" role="listitem">
              <ion-card-content>
                <div class="action-card__icon">
                  <ion-icon [name]="accion.icono" />
                </div>
                <h3>{{ accion.titulo }}</h3>
                <p>{{ accion.descripcion }}</p>
              </ion-card-content>
            </ion-card>
          }
        </div>
        <ion-button class="open-operation" expand="block" (click)="abrirOperacion()">
          <ion-icon slot="start" name="sparkles-outline" />
          Abrir el centro de operación
        </ion-button>
      </section>
    </main>
  }
</ion-content>
